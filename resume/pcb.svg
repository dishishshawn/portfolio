<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Seamless PCB tile: every trace that leaves one edge re-enters at the
       same coordinate on the opposite edge. Top-layer copper is brighter;
       bottom-layer copper shows dimmer through the solder mask. Crossings
       only happen between layers, and layer changes go through vias. -->
  <rect width="360" height="360" fill="#16322a"/>

  <g fill="none" stroke="#1d3f34" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- bottom layer -->
    <path d="M200 0 V120 L230 150 V260 L200 290 V360"/>
    <path d="M40 0 V360"/>
    <path d="M330 0 V70 L310 90 V250 L330 270 V360"/>
  </g>

  <g fill="none" stroke="#24503f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- top layer: a differential pair and two single traces -->
    <path d="M0 48 H120 L150 78 H232 L262 48 H360"/>
    <path d="M0 64 H113 L143 94 H239 L269 64 H360"/>
    <path d="M0 212 H70 L100 182 H280 L310 212 H360"/>
    <path d="M40 300 H175 L200 325"/>
    <path d="M138 128 H170 L200 158"/>
  </g>

  <!-- SOIC-8 footprint, HASL pads -->
  <g fill="#3f5a51">
    <rect x="82" y="113" width="16" height="7" rx="1"/>
    <rect x="82" y="125" width="16" height="7" rx="1"/>
    <rect x="82" y="137" width="16" height="7" rx="1"/>
    <rect x="82" y="149" width="16" height="7" rx="1"/>
    <rect x="130" y="113" width="16" height="7" rx="1"/>
    <rect x="130" y="125" width="16" height="7" rx="1"/>
    <rect x="130" y="137" width="16" height="7" rx="1"/>
    <rect x="130" y="149" width="16" height="7" rx="1"/>
  </g>
  <rect x="101" y="110" width="26" height="49" fill="none" stroke="#2c4d43" stroke-width="1.5"/>

  <!-- vias: layer changes plus a line of stitching vias -->
  <g fill="#2f5e4d">
    <circle cx="40" cy="300" r="8"/>
    <circle cx="200" cy="325" r="8"/>
    <circle cx="200" cy="158" r="8"/>
    <circle cx="270" cy="300" r="6"/>
    <circle cx="300" cy="300" r="6"/>
    <circle cx="270" cy="330" r="6"/>
    <circle cx="300" cy="330" r="6"/>
  </g>
  <g fill="#0f241e">
    <circle cx="40" cy="300" r="3.5"/>
    <circle cx="200" cy="325" r="3.5"/>
    <circle cx="200" cy="158" r="3.5"/>
    <circle cx="270" cy="300" r="2.5"/>
    <circle cx="300" cy="300" r="2.5"/>
    <circle cx="270" cy="330" r="2.5"/>
    <circle cx="300" cy="330" r="2.5"/>
  </g>
</svg>
